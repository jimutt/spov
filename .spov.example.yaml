# Project-level spov configuration. Copy to .spov.yaml.
# Safe to commit: it contains no secrets.
version: 1

# Git platforms are declared in ~/.config/spov/config.yaml, never here: a
# project file may not say where your credentials are sent. The repos below
# name those platforms.
#
# NOTE: lists are REPLACED by a later layer, not merged. Lists cannot be set
# through SPOV_* environment variables; only scalar keys can.

# Repositories cloned into the sandbox workspace before OpenCode starts.
# Listing them here makes a plain `spov fly` in this checkout launch these,
# unsynced, instead of syncing the checkout itself; leave repos out for that.
repos:
  - platform: codefloe
    owner: alice
    name: widgets
  - platform: github
    owner: acme
    name: gadgets
    dir: tools

# The repo directory the OpenCode server starts in.
landing: widgets

sandbox:
  cpu: 0.5
  memory_mib: 2048
  timeout: 4h        # hard cap is 12h
  idle_timeout: 30m
  # Curated add-ons beyond the default toolchain, as name or name@version:
  # dotnet, java, php, playwright, postgres, redis, ruby, rust.
  # addons: [rust, postgres]
  # apt: [libvips-dev]
  # Unset, a plain `spov fly` inside a checkout syncs it; false never syncs.
  # sync: false

opencode:
  version: 2.2.5
  port: 4096

modal:
  app: spov
  # environment: dev
