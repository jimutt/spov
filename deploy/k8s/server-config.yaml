# The server's own user file, mounted at the path the server reads
# ($XDG_CONFIG_HOME/spov/config.yaml, /home/nonroot/.config/spov/config.yaml
# in the image). It mirrors deploy/server-config.yaml, which Kamal and
# Compose mount directly; manifests here are standalone plain YAML, so
# the content is repeated and the two must be kept in step.
#
# Fill in the account, then apply. An organisation token variable
# (SPOV_PLATFORM_TOKEN_<NAME>) attaches to the platform of that name
# below — a variable naming no declared platform is ignored.
#
# @decision(DL-105)
apiVersion: v1
kind: ConfigMap
metadata:
  name: spov-server-config
data:
  config.yaml: |
    version: 1

    platforms:
      - name: github
        kind: github
        # base_url defaults to https://github.com; set it for GHE.
        account: <your-github-account>   # the user the org PAT belongs to, or the org a GitHub App is installed on

    # Single operator: the deployment's own credential may serve `all` git
    # access, so jobs and browser launches are never needlessly narrowed.
    # git:
    #   allow_all: true

    # Keep sandboxes near the deployment; broad (us, eu, ap) or narrow (eu-west, ...).
    # And OpenCode 2 plugins every interactive session gets (docs/plugins.md).
    # sandbox:
    #   regions: [eu]
    #   plugins: [envsitter-guard@0.1.1]

    # Behind a reverse proxy: the proxy's address or range, so the per-address
    # sign-in limits count each client rather than the proxy (docs/server.md#limits).
    # Behind Kamal, the subnet `docker network inspect kamal` reports (usually
    # inside 172.16.0.0/12); on Kubernetes, the ingress controller's pod network.
    # server:
    #   trusted_proxies: [172.16.0.0/12]

    # A deployment open to people you do not know: build no add-on image on a
    # launch, and prebuild the ones you want with `spov serve image build`.
    # modal:
    #   build_on_demand: false

    # Per-user limits; these are the defaults (deploy/README.md#quotas).
    # quotas:
    #   max_concurrent_sessions: 5
    #   max_concurrent_jobs: 4
    #   max_job_duration: 4h

    # Exit snapshots, which keep a stopped session resumable and cost Modal
    # storage; these are the defaults.
    # snapshots:
    #   enabled: true
    #   retention: 168h
    #   max_per_user: 20

    # How much one session's events and messages may occupy before its
    # recording stops (the default).
    # history:
    #   max_session_mib: 1024

    # A Prometheus listener for the metrics in docs/metrics.md, apart from the
    # API's port; expose it only to your scraper.
    # metrics:
    #   prometheus_listen: 127.0.0.1:9464
