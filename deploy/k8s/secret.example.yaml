# A template. Do not commit real values: create the Secret with
# `kubectl create secret generic spov-secrets --from-literal=...` or a
# sealed-secrets equivalent.
#
# @decision(DL-010)
apiVersion: v1
kind: Secret
metadata:
  name: spov-secrets
type: Opaque
stringData:
  # Clients authenticate with it; the server refuses to start without one.
  SPOV_SERVER_TOKEN: ""
  SPOV_DATABASE_URL: "postgres://user:password@host:5432/spov?sslmode=require"
  # Seals each user's own platform credentials at rest (DL-008).
  # 32 bytes, base64: openssl rand -base64 32. Empty stores none.
  SPOV_CREDENTIAL_KEY: ""
  # The previous key, during a rotation only.
  SPOV_CREDENTIAL_KEY_OLD: ""
  # The deployment's own git credentials, for users who stored none.
  #
  # @decision(DL-042)
  SPOV_GITHUB_APP_ID: ""
  SPOV_GITHUB_APP_PRIVATE_KEY: ""
  SPOV_GITHUB_OAUTH_CLIENT_ID: ""
  SPOV_GITHUB_OAUTH_CLIENT_SECRET: ""
  MODAL_TOKEN_ID: ""
  MODAL_TOKEN_SECRET: ""
  ANTHROPIC_API_KEY: ""
