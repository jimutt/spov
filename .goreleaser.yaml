version: 2

project_name: spov

before:
  hooks:
    - go mod tidy
    # Released binaries carry the dashboard; without this they would
    # embed the placeholder and every install would serve it.
    #
    # @decision(DL-055)
    - bash scripts/build-web.sh
    # Released binaries carry the sidecar proxy; without it a server
    # launches sandboxes with their tokens in the main container.
    #
    # @decision(DL-034)
    - bash scripts/build-proxy.sh

builds:
  - id: spov
    main: ./cmd/spov
    binary: spov
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jimutt/spov/internal/version.version={{.Version}}
      - -X github.com/jimutt/spov/internal/version.commit={{.FullCommit}}
      - -X github.com/jimutt/spov/internal/version.date={{.Date}}

archives:
  - id: spov
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# The checksums are signed with cosign's keyless flow, through the release
# workflow's OIDC token, so the signature names the workflow and the tag.
#
# @decision(DL-079)
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

# The cask is written to the tap only when its token is set, so a release
# never fails for want of one.
#
# @decision(DL-081)
homebrew_casks:
  - name: spov
    ids: [spov]
    repository:
      owner: jimutt
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/jimutt/spov
    description: Launch OpenCode sessions in on-demand Modal sandboxes
    license: MIT
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/spov"]
          end

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
