            description: Session ID or name
            type: string
        - description: Resume after this log position; omit to replay from the beginning
          explode: false
          in: query
          name: after
          schema:
            description: Resume after this log position; omit to replay from the beginning
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/EndEvent"
                        event:
                          const: end
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event end
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/ErrorEvent"
                        event:
                          const: error
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event error
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/LogEvent"
                        event:
                          const: log
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event log
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        "401":
          content:
            application/problem+json:
