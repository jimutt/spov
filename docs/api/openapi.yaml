components:
  schemas:
    AdminEventView:
      additionalProperties: false
      properties:
        action:
          type: string
        actor:
          type: string
        at:
          format: date-time
          type: string
        detail:
          type: string
      required:
        - actor
        - action
        - at
      type: object
    AllowlistEntryView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AllowlistEntryView.json
          format: uri
          readOnly: true
          type: string
        admin:
          description: Whether this address administers the org
          type: boolean
        created_at:
          format: date-time
          type: string
        email:
          description: The address, lower-cased
          type: string
      required:
        - email
        - admin
        - created_at
      type: object
    AllowlistOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AllowlistOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          items:
            $ref: "#/components/schemas/AllowlistEntryView"
          type:
            - array
            - "null"
      required:
        - entries
      type: object
    AnsweredAsk:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AnsweredAsk.json
          format: uri
          readOnly: true
          type: string
        conversation:
          description: The OpenCode conversation the request was asked in
          type: string
        decision:
          enum:
            - once
            - reject
            - answered
            - dismissed
          type: string
        id:
          type: string
      required:
        - id
        - conversation
        - decision
      type: object
    AppCheck:
      additionalProperties: false
      properties:
        account:
          type: string
        at:
          format: date-time
          type: string
        error:
          type: string
        missing:
          items:
            type: string
          type:
            - array
            - "null"
        permissions:
          additionalProperties:
            type: string
          type: object
        repo_count:
          format: int64
          type: integer
        repos:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - at
        - repo_count
      type: object
    AskEvent:
      additionalProperties: false
      properties:
        action:
          type: string
        answer:
          additionalProperties: {}
          type: object
        call:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/FormField"
          type:
            - array
            - "null"
        id:
          type: string
        kind:
          enum:
            - permission
            - form
          type: string
        reply:
          type: string
        resources:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
      required:
        - id
        - kind
      type: object
    CancelledMessage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CancelledMessage.json
          format: uri
          readOnly: true
          type: string
        conversation:
          description: The OpenCode conversation the message was in
          type: string
        id:
          type: string
      required:
        - id
        - conversation
      type: object
    CatalogueView:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type: string
        source:
          enum:
            - live
            - snapshot
          type: string
      required:
        - source
        - as_of
      type: object
    ConnectionView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConnectionView.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          description: When the token stops working
          format: date-time
          type: string
        idle_timeout_secs:
          description: Sandbox idle timeout, for pacing a heartbeat
          format: int64
          type: integer
        password:
          description: Basic auth password for the OpenCode server
          type: string
        token:
          description: Connect token, sent as the _modal_connect_token cookie
          type: string
        url:
          description: Edge endpoint for the session's port
          type: string
        user:
          description: Basic auth user for the OpenCode server
          type: string
      required:
        - url
        - token
        - user
        - password
        - expires_at
      type: object
    ConversationView:
      additionalProperties: false
      properties:
        id:
          type: string
        messages:
          items:
            $ref: "#/components/schemas/MessageView"
          type:
            - array
            - "null"
        title:
          type: string
      required:
        - id
        - messages
      type: object
    CreateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
      required:
        - id
      type: object
    CredentialView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CredentialView.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          description: When the token stops working, when its forge says
          format: date-time
          type: string
        platform:
          type: string
        present:
          type: boolean
        scopes:
          description: The token's scopes, when its forge reports them
          items:
            type: string
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
        verified_as:
          type: string
      required:
        - platform
        - present
      type: object
    CredentialsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CredentialsOutputBody.json
          format: uri
          readOnly: true
          type: string
        credentials:
          items:
            $ref: "#/components/schemas/CredentialView"
          type:
            - array
            - "null"
        enabled:
          type: boolean
      required:
        - credentials
        - enabled
      type: object
    DeliverableView:
      additionalProperties: false
      properties:
        branch:
          type: string
        detail:
          description: What was found about it, for a person
          type: string
        forge:
          description: "The platform's kind: github, forgejo, gitea or gitlab, where a pull request is a merge request"
          type: string
        kind:
          enum:
            - pr
            - report
          type: string
        number:
          description: The pull request's number
          format: int64
          type: integer
        path:
          description: A report's path under the job's out directory
          type: string
        platform:
          description: The configured platform a pull request's repository is on
          type: string
        repository:
          description: A pull request's repository, as its whole path (owner/name, or a GitLab group path and name)
          type: string
        size:
          description: A report's size in bytes
          format: int64
          type: integer
        status:
          enum:
            - verified
            - missing
            - unverified
            - over_limit
            - withdrawn
          type: string
        title:
          type: string
        url:
          description: The pull request's page
          type: string
      required:
        - kind
        - status
      type: object
    EndEvent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        reason:
          description: Why the server closed the stream
          enum:
            - lifetime
            - stopped
          type: string
      required:
        - reason
        - at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorEvent:
      additionalProperties: false
      properties:
        problem:
          $ref: "#/components/schemas/ProblemView"
      required:
        - problem
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FormAnswer:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormAnswer.json
          format: uri
          readOnly: true
          type: string
        answer:
          additionalProperties: {}
          description: "The answer, keyed by field key: a string, a number, a boolean or a list of strings"
          type: object
      required:
        - answer
      type: object
    FormField:
      additionalProperties: false
      properties:
        custom:
          type: boolean
        default: {}
        description:
          type: string
        hidden:
          type: boolean
        key:
          type: string
        options:
          items:
            $ref: "#/components/schemas/FormOption"
          type:
            - array
            - "null"
        placeholder:
          type: string
        required:
          type: boolean
        title:
          type: string
        type:
          type: string
        url:
          type: string
        when:
          items:
            $ref: "#/components/schemas/FormWhen"
          type:
            - array
            - "null"
      required:
        - key
        - type
      type: object
    FormOption:
      additionalProperties: false
      properties:
        description:
          type: string
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
    FormWhen:
      additionalProperties: false
      properties:
        key:
          type: string
        op:
          enum:
            - eq
            - neq
          type: string
        value: {}
      required:
        - key
        - op
        - value
      type: object
    GateResult:
      additionalProperties: false
      properties:
        detail:
          type: string
        gate:
          type: string
        outcome:
          enum:
            - passed
            - partial
            - failed
            - unverified
          type: string
      required:
        - gate
        - outcome
        - detail
      type: object
    GitIdentityView:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      type: object
    InterruptRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/InterruptRequest.json
          format: uri
          readOnly: true
          type: string
        conversation:
          description: OpenCode conversation id; required when the session has more than one
          type: string
      type: object
    Interrupted:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Interrupted.json
          format: uri
          readOnly: true
          type: string
        conversation:
          description: The OpenCode conversation whose turn was stopped
          type: string
        interrupted:
          type: boolean
      required:
        - interrupted
        - conversation
      type: object
    JobRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/JobRequest.json
          format: uri
          readOnly: true
          type: string
        addons:
          description: Curated add-ons as name or name@version, e.g. rust, java@21; the image is a variant of the base
          items:
            type: string
          maxItems: 16
          type:
            - array
            - "null"
        apt:
          description: Extra Debian packages for the image variant
          items:
            type: string
          maxItems: 32
          type:
            - array
            - "null"
        check:
          description: Command whose exit status verifies the work, run at the workspace root, e.g. ./repo/scripts/check.sh
          type: string
        credential_preference:
          additionalProperties:
            type: string
          description: "Per configured platform, the credential tried first: user (your own, the default) or org (the organisation's)"
          type: object
        credentials:
          description: Attach exactly these routed credentials, asked-only ones included
          items:
            type: string
          maxItems: 96
          type:
            - array
            - "null"
        credentials_preferred:
          description: "The configuration's narrowing: keep only these of the default, or none for none; it never adds one"
          items:
            type: string
          maxItems: 96
          type:
            - array
            - "null"
        egress:
          description: Egress preset name
          type: string
        egress_extra_domains:
          description: Domains added to the egress preset (not with open), at most 16
          items:
            type: string
          maxItems: 16
          type:
            - array
            - "null"
        git:
          $ref: "#/components/schemas/GitIdentityView"
        git_access:
          description: "How far the forge credentials reach: the job's repositories, or every repository they can; the caller's job default, then repos, when empty"
          enum:
            - repos
            - all
          type: string
        git_access_preferred:
          description: "The git access is a saved preference, such as the CLI's config: a platform that cannot have all gets repos rather than refusing the job"
          type: boolean
        goal:
          description: What the job should accomplish
          minLength: 1
          type: string
        image:
          type: string
        kind:
          description: What the job delivers
          enum:
            - pr
            - report
          type: string
        landing:
          description: Workspace directory to start in; the workspace root when empty
          type: string
        max_duration:
          description: How long the job may run unattended, as a duration such as 45m; your default, else 1h, when empty
          type: string
        max_duration_preferred:
          description: "max_duration is the client's configured default: clamped to the limit rather than refused"
          type: boolean
        model:
          description: Model to run on, as provider/model; OpenCode's default when empty
          type: string
        needs:
          description: Hosts the project needs; the launch notes any no routed credential covers
          items:
            type: string
          maxItems: 16
          type:
            - array
            - "null"
        no_credentials:
          description: Attach no routed credential
          type: boolean
        repos:
          items:
            $ref: "#/components/schemas/RepoRef"
          minItems: 1
          type:
            - array
            - "null"
        sandbox:
          $ref: "#/components/schemas/SandboxConfigView"
      required:
        - goal
        - kind
        - repos
      type: object
    JobView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/JobView.json
          format: uri
          readOnly: true
          type: string
        attempt:
          format: int64
          type: integer
        clock_started_at:
          description: When the current unattended stretch began; absent while the clock is stopped
          format: date-time
          type: string
        clock_used:
          description: Unattended time used before the current stretch
          type: string
        created_at:
          format: date-time
          type: string
        deliverables:
          description: "What the job delivered: its pull requests or reports, each with what was found about it. Report bodies are read from GET /api/v1/jobs/{id}/file."
          items:
            $ref: "#/components/schemas/DeliverableView"
          type:
            - array
            - "null"
        error:
          type: string
        gates:
          description: Each completion gate's finding
          items:
            $ref: "#/components/schemas/GateResult"
          type:
            - array
            - "null"
        goal:
          type: string
        id:
          description: ULID
          type: string
        kind:
          enum:
            - pr
            - report
          type: string
        max_duration:
          description: How long the job may run unattended
          type: string
        model:
          description: Model the job runs on, as provider/model; empty is OpenCode's default
          type: string
        owner_id:
          type: string
        partial:
          description: The job succeeded with part of its deliverables, or with unfinished work
          type: boolean
        session_id:
          type: string
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - queued
            - provisioning
            - running
            - delivering
            - succeeded
            - failed
            - blocked
            - steered
            - cancelled
          type: string
        stopped_at:
          format: date-time
          type: string
        unfinished:
          description: What the agent said it left unfinished
          type: string
        updated_at:
          format: date-time
          type: string
        verdict:
          description: What each completion gate found
          type: string
      required:
        - id
        - kind
        - state
        - owner_id
        - session_id
        - goal
        - deliverables
        - attempt
        - created_at
        - updated_at
      type: object
    ListJobsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListJobsOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobs:
          items:
            $ref: "#/components/schemas/JobView"
          type:
            - array
            - "null"
        next:
          description: Pass as before for the next page; absent on the last
          type: string
        total:
          description: How many jobs match the filter in all
          format: int64
          type: integer
      required:
        - jobs
        - total
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        next:
          description: Pass as before for the next page; absent on the last
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/SessionView"
          type:
            - array
            - "null"
        total:
          description: How many sessions match the filter in all
          format: int64
          type: integer
      required:
        - sessions
        - total
      type: object
    LogEvent:
      additionalProperties: false
      properties:
        after:
          type: string
        ask:
          $ref: "#/components/schemas/AskEvent"
        at:
          format: date-time
          type: string
        call:
          type: string
        delivery:
          type: string
        message:
          type: string
        model:
          type: string
        name:
          type: string
        pos:
          format: int64
          type: integer
        role:
          type: string
        session:
          type: string
        source:
          enum:
            - opencode
            - ephemeral
            - spov
          type: string
        text:
          type: string
        tool:
          type: string
      required:
        - name
        - source
        - at
        - pos
      type: object
    MeView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MeView.json
          format: uri
          readOnly: true
          type: string
        admin:
          type: boolean
        default_git_access:
          enum:
            - repos
            - all
          type: string
        default_job_duration:
          description: The wall clock jobs get when they name none, such as 2h
          type: string
        default_job_git_access:
          enum:
            - repos
            - all
          type: string
        default_model:
          type: string
        email:
          type: string
        git_email:
          type: string
        git_name:
          type: string
        org_id:
          type: string
        quota:
          $ref: "#/components/schemas/QuotaView"
        user_id:
          type: string
      required:
        - user_id
        - org_id
        - admin
        - quota
      type: object
    MessageView:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        id:
          type: string
        role:
          description: "Who spoke: user or assistant"
          type: string
        text:
          type: string
      type: object
    MessagesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MessagesOutputBody.json
          format: uri
          readOnly: true
          type: string
        conversations:
          items:
            $ref: "#/components/schemas/ConversationView"
          type:
            - array
            - "null"
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - conversations
      type: object
    ModelProviderView:
      additionalProperties: false
      properties:
        beta:
          items:
            type: string
          type:
            - array
            - "null"
        have_key:
          type: boolean
        key_env:
          type: string
        models:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        provider:
          type: string
        sign_in:
          enum:
            - opencode
          type: string
      required:
        - provider
        - name
        - key_env
        - have_key
        - models
      type: object
    ModelSwitch:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ModelSwitch.json
          format: uri
          readOnly: true
          type: string
        conversation:
          description: OpenCode conversation id; required when the session has more than one
          type: string
        model:
          description: The model to switch to, as provider/model
          maxLength: 256
          minLength: 1
          type: string
      required:
        - model
      type: object
    ModelsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ModelsOutputBody.json
          format: uri
          readOnly: true
          type: string
        catalogue:
          $ref: "#/components/schemas/CatalogueView"
        providers:
          items:
            $ref: "#/components/schemas/ModelProviderView"
          type:
            - array
            - "null"
      required:
        - providers
        - catalogue
      type: object
    NoteEvent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        message:
          type: string
      required:
        - message
        - at
      type: object
    OpenCodeAttemptView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OpenCodeAttemptView.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        interval:
          format: int64
          type: integer
        reason:
          type: string
        state:
          enum:
            - pending
            - connected
            - failed
            - expired
          type: string
        user_code:
          type: string
        verification_url:
          type: string
      required:
        - id
        - state
        - verification_url
        - user_code
        - expires_at
        - interval
      type: object
    OpenCodeConnectionView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OpenCodeConnectionView.json
          format: uri
          readOnly: true
          type: string
        connected:
          type: boolean
        connected_at:
          format: date-time
          type: string
        enabled:
          type: boolean
        expires_at:
          format: date-time
          type: string
        needs_reconnect:
          type: boolean
        org_id:
