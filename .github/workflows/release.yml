name: release

# A tag makes a draft release: goreleaser's archives for Linux and macOS,
# checksums.txt signed keylessly with cosign, a build provenance
# attestation per archive, and the Homebrew cask when the tap's token is
# set. A person publishes the draft. Once the release check has passed,
# the server image is built for amd64 and arm64, pushed to ghcr.io,
# signed by its digest and attested.
#
# @decision(DL-079) @decision(DL-081) @decision(DL-082)
on:
  push:
    tags: ["v*"]

# Each job names what it needs; a job gets nothing else.
permissions: {}

env:
  GO_VERSION: "1.26.11"
  GOVULNCHECK_VERSION: "v1.9.0"
  GORELEASER_VERSION: "v2.18.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Bun
        run: bash scripts/install-bun.sh >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install goreleaser
        env:
          CGO_ENABLED: "0"
        # setup-go exports GOTOOLCHAIN=local, and goreleaser's own go.mod
        # asks for a newer Go than spov builds with; auto lets the install
        # fetch it, for this tool only.
        run: GOTOOLCHAIN=auto go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"

      # No release is built on a Go with a reachable advisory.
      - name: govulncheck
        env:
          CGO_ENABLED: "0"
        run: |
          GOTOOLCHAIN=auto go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      # This platform's binary, built as the release builds it, must carry
      # the web app and the proxy and report the tag's version, or nothing
      # is released.
      - name: Release check
        env:
          CGO_ENABLED: "0"
        run: |
          goreleaser build --single-target --clean --id spov -o "$RUNNER_TEMP/spov"
          bash scripts/release-check.sh "$RUNNER_TEMP/spov" "$GITHUB_REF_NAME"

      - name: Release (a draft)
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: goreleaser release --clean

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$IMAGE:$version"
          # A prerelease never moves latest; the examples never use it.
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Kamal requires the image to carry the service label; without it
          # `kamal deploy` refuses the pulled image.
          labels: service=spov
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.tags.outputs.date }}
      - name: Sign the image by its digest
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: The digest the examples pin
        run: echo "::notice title=image::$IMAGE:${{ steps.tags.outputs.version }}@${{ steps.push.outputs.digest }}"
